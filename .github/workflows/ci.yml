name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies (root)
        run: npm ci

      - name: Install dependencies (server & client)
        run: |
          cd server && npm ci
          cd ../client && npm ci
          cd ..

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run Tests
        run: npm test

      - name: Build Project
        run: npm run build
